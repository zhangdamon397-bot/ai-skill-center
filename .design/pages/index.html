    <script>
      // Video scrub control
      (function () {
        var SENSITIVITY = 0.8;
        var video = document.getElementById('bg-video');
        var targetTime = 0;
        var prevX = null;
        var isSeeking = false;
        var isLoaded = false;

        function performSeek() {
          if (!video.duration || !isLoaded) return;
          var clamped = Math.max(0, Math.min(targetTime, video.duration));
          isSeeking = true;
          video.currentTime = clamped;
        }

        video.addEventListener('loadedmetadata', function () {
          targetTime = 0;
          isLoaded = true;
        });

        video.addEventListener('seeked', function () {
          isSeeking = false;
          var diff = Math.abs(targetTime - video.currentTime);
          if (diff > 0.01 && video.duration) {
            performSeek();
          }
        });

        window.addEventListener('mousemove', function (e) {
          if (!video.duration) return;

          var currentX = e.clientX;
          if (prevX === null) {
            prevX = currentX;
            return;
          }

          var delta = currentX - prevX;
          prevX = currentX;

          var timeDelta = (delta / window.innerWidth) * SENSITIVITY * video.duration;
          targetTime = Math.max(0, Math.min(targetTime + timeDelta, video.duration));

          if (!isSeeking) {
            performSeek();
          }
        });

        window.addEventListener('mouseleave', function () {
          prevX = null;
        });
      })();

      // Typewriter effect
      (function () {
        var text = '欢迎来到AI技能提升中心，从这里开启你的AI学习之旅。';
        var speed = 80;
        var startDelay = 600;
        var textEl = document.getElementById('typewriter-text');
        var cursorEl = document.getElementById('typewriter-cursor');
        var index = 0;

        function startTyping() {
          var interval = setInterval(function () {
            index += 1;
            textEl.textContent = text.slice(0, index);

            if (index >= text.length) {
              clearInterval(interval);
              cursorEl.style.display = 'none';
            }
          }, speed);
        }

        setTimeout(startTyping, startDelay);
      })();

      // Pill buttons fade-in
      (function () {
        setTimeout(function () {
          var pills = document.getElementById('pill-buttons');
          if (pills) {
            pills.classList.add('visible');
          }
        }, 400);
      })();

      // Mobile menu toggle
      (function () {
        var btn = document.getElementById('mobile-menu-btn');
        var overlay = document.getElementById('mobile-overlay');
        var top = document.getElementById('hamburger-top');
        var mid = document.getElementById('hamburger-mid');
        var bot = document.getElementById('hamburger-bot');
        var open = false;

        btn.addEventListener('click', function () {
          open = !open;
          if (open) {
            overlay.style.opacity = '1';
            overlay.style.pointerEvents = 'auto';
            top.style.transform = 'rotate(45deg) translateY(7px)';
            mid.style.opacity = '0';
            bot.style.transform = 'rotate(-45deg) translateY(-7px)';
          } else {
            overlay.style.opacity = '0';
            overlay.style.pointerEvents = 'none';
            top.style.transform = 'none';
            mid.style.opacity = '1';
            bot.style.transform = 'none';
          }
        });

        // Close on link click
        var links = overlay.querySelectorAll('a');
        links.forEach(function (link) {
          link.addEventListener('click', function () {
            open = false;
            overlay.style.opacity = '0';
            overlay.style.pointerEvents = 'none';
            top.style.transform = 'none';
            mid.style.opacity = '1';
            bot.style.transform = 'none';
          });
        });
      })();

      // Copy email to clipboard
      (function () {
        var btn = document.getElementById('copy-email-btn');
        var msg = document.getElementById('copied-msg');
        var email = 'XXX@163.com';

        btn.addEventListener('click', function () {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(email).then(function () {
              msg.style.opacity = '0.8';
              setTimeout(function () {
                msg.style.opacity = '0';
              }, 2000);
            });
          }
        });
      })();
    </script>
