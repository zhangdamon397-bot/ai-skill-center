<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preflight</title>
    <style id="theme-vars">
:root {
  --font-heading: 'HelveticaNowDisplay-Medium', 'Helvetica Neue', Arial, sans-serif;
  --font-body: 'HelveticaNowDisplayW01-Rg', 'Helvetica Neue', Arial, sans-serif;

  --mainframe-background: #ffffff;
  --mainframe-foreground: #000000;
  --mainframe-card: #ffffff;
  --mainframe-card-foreground: #000000;
  --mainframe-popover: #ffffff;
  --mainframe-popover-foreground: #000000;
  --mainframe-primary: #000000;
  --mainframe-primary-foreground: #ffffff;
  --mainframe-muted: #f5f5f5;
  --mainframe-muted-foreground: #737373;
  --mainframe-accent: #f5f5f5;
  --mainframe-accent-foreground: #000000;
  --mainframe-destructive: #ef4444;
  --mainframe-destructive-foreground: #ffffff;
  --mainframe-border: rgba(0, 0, 0, 0.1);
  --mainframe-input: rgba(0, 0, 0, 0.1);
  --mainframe-ring: #000000;

  --mainframe-radius-sm: 4px;
  --mainframe-radius-md: 8px;
  --mainframe-radius-lg: 16px;
  --mainframe-radius-xl: 999px;
}

body {
  font-family: var(--font-body);
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>

  @theme inline {
    --color-background: var(--mainframe-background);
    --color-foreground: var(--mainframe-foreground);
    --color-card: var(--mainframe-card);
    --color-card-foreground: var(--mainframe-card-foreground);
    --color-popover: var(--mainframe-popover);
    --color-popover-foreground: var(--mainframe-popover-foreground);
    --color-primary: var(--mainframe-primary);
    --color-primary-foreground: var(--mainframe-primary-foreground);
    --color-muted: var(--mainframe-muted);
    --color-muted-foreground: var(--mainframe-muted-foreground);
    --color-accent: var(--mainframe-accent);
    --color-accent-foreground: var(--mainframe-accent-foreground);
    --color-destructive: var(--mainframe-destructive);
    --color-destructive-foreground: var(--mainframe-destructive-foreground);
    --color-border: var(--mainframe-border);
    --color-input: var(--mainframe-input);
    --color-ring: var(--mainframe-ring);
    --radius-sm: var(--mainframe-radius-sm);
    --radius-md: var(--mainframe-radius-md);
    --radius-lg: var(--mainframe-radius-lg);
    --radius-xl: var(--mainframe-radius-xl);
  }
  @layer base {
    body { background: var(--mainframe-background); color: var(--mainframe-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
